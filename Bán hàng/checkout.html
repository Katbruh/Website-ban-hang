<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phát Đạt - Thanh Toán Đơn Hàng</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: #1f1f1f;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ddd;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            outline: none;
        }
        .order-summary-box {
            background-color: #161616;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .btn-confirm-payment {
            background-color: #27ae60;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .btn-confirm-payment:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html" class="logo-link">
                <img src="img/logo.png" alt="Phát Đạt Logo" class="logo-img">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="menu.html">Thực đơn</a></li>
                <li><a href="cart.html">Giỏ hàng</a></li>
                <li><a href="orders.html">Lịch sử đơn hàng</a></li>
            </ul>
        </nav>
    </header>

    <main class="checkout-container">
        <h2 style="color: #e74c3c; margin-bottom: 20px; text-align: center;">Thông Tin Thanh Toán</h2>
        
        <div class="order-summary-box">
            <h3>Tóm tắt đơn hàng</h3>
            <p>Tổng số lượng: <strong id="checkout-total-qty">3</strong> sản phẩm</p>
            <p>Tổng tiền cần thanh toán: <span id="checkout-total-price" style="color: #e74c3c; font-weight: bold;">55.000 VNĐ</span></p>
        </div>

        <form id="checkout-form">
            <div class="form-group">
                <label for="fullname">Họ và tên người nhận</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên..." required>
            </div>
            <div class="form-group">
                <label for="phone">Số điện thoại</label>
                <input type="tel" id="phone" placeholder="Nhập số điện thoại..." required>
            </div>
            <div class="form-group">
                <label for="address">Địa chỉ giao hàng</label>
                <textarea id="address" rows="3" placeholder="Nhập địa chỉ nhận hàng chi tiết..." required></textarea>
            </div>
            <div class="form-group">
                <label for="payment-method">Phương thức thanh toán</label>
                <select id="payment-method">
                    <option value="cod">Thanh toán khi nhận hàng (COD)</option>
                    <option value="momo">Ví MoMo</option>
                    <option value="banking">Chuyển khoản Ngân hàng</option>
                </select>
            </div>
            <button type="submit" class="btn-confirm-payment">Xác Nhận Đặt Hàng</button>
        </form>
    </main>

    <footer>
        <div class="footer-bottom" style="text-align: center; max-width: 1200px; margin: 30px auto 0 auto; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 20px;">
            <p>&copy; 2026 Đồ án Lập trình Web - Nhóm 6969.</p>
        </div>
    </footer>

    <script>
        // Tính tổng tiền dựa trên giỏ hàng thực tế
        document.addEventListener("DOMContentLoaded", function() {
            let cartItems = JSON.parse(localStorage.getItem('cart_products')) || [];
            let totalQty = 0;
            let totalPrice = 0;
            let itemsSummaryText = [];

            cartItems.forEach(item => {
                totalQty += item.quantity;
                totalPrice += item.price * item.quantity;
                itemsSummaryText.push(`${item.name} (x${item.quantity})`);
            });

            document.getElementById('checkout-total-qty').textContent = totalQty;
            document.getElementById('checkout-total-price').textContent = totalPrice.toLocaleString('vi-VN') + ' VNĐ';

            document.getElementById('checkout-form').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const newOrder = {
                    id: 'DH' + Math.floor(100000 + Math.random() * 900000),
                    date: new Date().toLocaleDateString('vi-VN'),
                    items: itemsSummaryText.join(', '),
                    total: totalPrice.toLocaleString('vi-VN') + ' VNĐ',
                    status: 'Đang chuẩn bị'
                };

                let orders = JSON.parse(localStorage.getItem('my_orders')) || [];
                orders.unshift(newOrder);
                localStorage.setItem('my_orders', JSON.stringify(orders));

                // Xóa giỏ hàng sau khi thanh toán thành công
                localStorage.removeItem('cart_products');
                localStorage.setItem('cart_count', '0');

                alert("Thanh toán thành công! Đơn hàng của bạn đã được lưu vào lịch sử.");
                window.location.href = 'orders.html';
            });
        });
    </script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Lấy tổng số lượng sản phẩm từ localStorage (nếu không có thì mặc định là 0 hoặc 3 tùy ý bạn)
        let count = localStorage.getItem('cart_count') || '0';
        
        // Cập nhật vào tất cả các thẻ có id="cart-count" trên header
        document.querySelectorAll('#cart-count').forEach(el => {
            el.textContent = count;
        });
    });
</script>
</body>
</html>
