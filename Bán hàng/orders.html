<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phát Đạt - Lịch Sử Đơn Hàng</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .orders-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 30px;
            background-color: #1f1f1f;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .orders-table th, .orders-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .orders-table th {
            background-color: #2c3e50;
            color: #f1c40f;
        }
        .status-badge {
            background-color: #e67e22;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html" class="logo-link">
                <img src="img/logo.png" alt="Phát Đạt Quán Ăn Logo" class="logo-img">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="menu.html">Thực đơn</a></li>
                <li><a href="cart.html">Giỏ hàng</a></li>
                <li><a href="orders.html" style="color: #F1C40F; font-weight: bold;">Lịch sử đơn hàng</a></li>
            </ul>
        </nav>
    </header>

    <main class="orders-container">
        <h2 style="color: #e74c3c; margin-bottom: 20px; text-align: center;">Lịch Sử Đơn Hàng Đã Mua</h2>
        
        <table class="orders-table">
            <thead>
                <tr>
                    <th>Mã đơn hàng</th>
                    <th>Ngày đặt</th>
                    <th>Sản phẩm</th>
                    <th>Tổng tiền</th>
                    <th>Trạng thái</th>
                </tr>
            </thead>
            <tbody id="orders-list">
                <!-- Dữ liệu render tự động -->
            </tbody>
        </table>
    </main>

    <footer>
        <div class="footer-bottom" style="text-align: center; max-width: 1200px; margin: 30px auto 0 auto; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 20px;">
            <p>&copy; 2026 Đồ án Lập trình Web - Nhóm 6969.</p>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const ordersList = document.getElementById('orders-list');
            let orders = JSON.parse(localStorage.getItem('my_orders')) || [];

            if (orders.length === 0) {
                orders = [
                    { id: 'DH883921', date: '28/10/2026', items: 'Khô Gà Lá Chanh (x2)', total: '60.000 VNĐ', status: 'Đã giao hàng' }
                ];
            }

            let html = '';
            orders.forEach(order => {
                html += `
                    <tr>
                        <td style="font-weight: bold; color: #3498db;">${order.id}</td>
                        <td>${order.date}</td>
                        <td style="text-align: left; padding-left: 20px;">${order.items}</td>
                        <td style="color: #e74c3c; font-weight: bold;">${order.total}</td>
                        <td><span class="status-badge">${order.status}</span></td>
                    </tr>
                `;
            });
            ordersList.innerHTML = html;
        });
    </script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Lấy tổng số lượng sản phẩm từ localStorage (nếu không có thì mặc định là 0 hoặc 3 tùy ý bạn)
        let count = localStorage.getItem('cart_count') || '0';
        
        // Cập nhật vào tất cả các thẻ có id="cart-count" trên header
        document.querySelectorAll('#cart-count').forEach(el => {
            el.textContent = count;
        });
    });
</script>
</body>
</html>
