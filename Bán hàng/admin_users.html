<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Người Dùng - Admin Phát Đạt</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 30px auto;
            background: #1f1f1f;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
        }

        h2 {
            color: #C0392B;
            margin-bottom: 20px;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid #444;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #2b2b2b;
        }

        .btn-lock {
            background-color: #E74C3C;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn-unlock {
            background-color: #27AE60;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        .nav-admin {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
        }

            .nav-admin a {
                text-decoration: none;
                font-weight: bold;
                color: #f1f1f1;
            }
    </style>
</head>
<body>
    <header>
        <div class="logo"><h1>Admin - Phát Đạt</h1></div>
        <nav>
            <ul>
                <li><a href="#" onclick="handleLogout()">Đăng xuất</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="admin-container">
            <div class="nav-admin">
                <a href="admin_index.html">Quản lý Sản phẩm</a> |
                <a href="admin_users.html" style="color: #C0392B;">Quản lý Người dùng</a>
            </div>

            <h2>Danh Sách Khách Hàng Hệ Thống</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên đăng nhập</th>
                        <th>Họ tên</th>
                        <th>Số điện thoại</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    <!-- Dữ liệu user sẽ được JavaScript render vào đây -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        // KIỂM TRA QUYỀN ADMIN KHI VÀO TRANG
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'admin') {
            alert("Bạn không có quyền truy cập trang quản trị!");
            window.location.href = "login.html";
        }

        // HÀM RENDER DANH SÁCH USER TỪ LOCALSTORAGE
        function renderUsers() {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = '';

            // Lọc chỉ hiển thị khách hàng (customer), ẩn tài khoản admin cho an toàn
            const customers = users.filter(u => u.role === 'customer');

            customers.forEach(user => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.fullName}</td>
                    <td>${user.phone}</td>
                    <td>${user.isLocked ? '<span style="color:red">Đã khóa</span>' : '<span style="color:green">Đang hoạt động</span>'}</td>
                    <td>
                        <button class="${user.isLocked ? 'btn-unlock' : 'btn-lock'}" onclick="toggleLockUser('${user.id}')">
                            ${user.isLocked ? 'Mở khóa' : 'Khóa'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // HÀM XỬ LÝ KHÓA / MỞ KHÓA TÀI KHOẢN (Tương tác trực tiếp LocalStorage)
        function toggleLockUser(userId) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            users = users.map(user => {
                if (user.id === userId) {
                    user.isLocked = !user.isLocked; // Đảo trạng thái khóa/mở khóa
                }
                return user;
            });

            // Lưu ngược lại xuống localStorage
            localStorage.setItem('users', JSON.stringify(users));
            alert("Đã cập nhật trạng thái tài khoản thành công!");
            renderUsers(); // Tải lại bảng
        }

        // Chạy hàm render khi vừa load trang
        renderUsers();

        function handleLogout() {
            localStorage.removeItem('currentUser');
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
