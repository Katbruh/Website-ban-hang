<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phát Đạt - Trải Nghiệm Ẩm Thực</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- HEADER -->
    <header>
    <div class="logo">
        <a href="index.html" class="logo-link">
            <img src="img/logo.png" alt="Phát Đạt Quán Ăn Logo" class="logo-img">
        </a>
    </div>
    <nav>
        <ul>
            <li><a href="index.html">Trang chủ</a></li>
            <li><a href="index.html#menu">Thực đơn</a></li>
            <li><a href="cart.html">Giỏ hàng (<span id="cart-count">0</span>)</a></li>
            <li id="auth-menu"><a href="login.html" id="login-btn">Đăng nhập / Đăng ký</a></li>
        </ul>
    </nav>
</header>

    <!-- MAIN CONTENT -->
    <main>
        <!-- Banner giới thiệu -->
        <section class="banner">
            <h2>Chào mừng đến với Quán Ăn Phát Đạt</h2>
            <p>Hương vị đậm đà - Phục vụ tận tâm</p>
        </section>

        <!-- Khu vực tìm kiếm & Lọc -->
        <section class="search-filter-section">
            <input type="text" id="search-name" placeholder="Tìm tên món ăn...">
            <select id="filter-category">
                <option value="all">Tất cả danh mục</option>
                <option value="M01">Nhóm bánh tráng & món trộn</option>
                <option value="M02">Nhóm đồ chiên, xiên que</option>
                <option value="M03">Nhóm trái cây lắc & ăn vặt khô</option>
                <option value="M04">Nhóm bánh & kẹo</option>
                <option value="M05">Nhóm giải khát</option>
            </select>

            <!-- Khung giá từ (Có hỗ trợ gõ & datalist gợi ý) -->
            <input type="text" id="min-price" placeholder="Giá từ..." list="min-price-list" autocomplete="off">
            <datalist id="min-price-list">
                <option value="0.000 VNĐ">
                <option value="10.000 VNĐ">
                <option value="20.000 VNĐ">
                <option value="50.000 VNĐ">
            </datalist>

            <!-- Khung đến giá -->
            <input type="text" id="max-price" placeholder="Đến giá..." list="max-price-list" autocomplete="off">
            <datalist id="max-price-list">
                <option value="50.000 VNĐ">
                <option value="100.000 VNĐ">
                <option value="200.000 VNĐ">
                <option value="500.000 VNĐ">
            </datalist>

            <button id="btn-search">Tìm kiếm</button>
        </section>

        <!-- Khu vực hiển thị danh sách sản phẩm -->
        <section id="menu" class="menu-section">
            <h3 class="section-title">Thực Đơn Của Chúng Tôi</h3>
            
            <div id="product-list" class="product-grid">
                <!-- Sản phẩm sẽ được render tự động từ main.js -->
            </div>

            <!-- Khu vực Phân trang -->
            <div id="pagination" class="pagination-container"></div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <h3>Quán Ăn Phát Đạt</h3>
            <p><strong>Địa chỉ:</strong> 273 Kinh Dương Vương, Phường Chợ Quán, TP. HCM</p>
            <p><strong>Hotline:</strong> 0123 456 789</p>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Đồ án Lập trình Web - Nhóm 6969.</p>
        </div>
    </footer>

    <!-- Các file JS xử lý -->
    <script src="initdata.js"></script>
    <script src="main.js"></script>
</body>
</html>
